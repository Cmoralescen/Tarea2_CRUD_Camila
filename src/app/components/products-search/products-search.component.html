<form [formGroup]="searchForm">
  <div>
    <h2 class="mb-3">Search Products</h2>
  </div>
  <div class="row">
    <div class="col-md-3">
      <div class="mb-2">
        <label class="mb-1" for="searchName">Product Name</label>
        <input 
          id="searchName" 
          formControlName="name" 
          type="text" 
          class="form-control"
          placeholder="Search by name...">
      </div>
    </div>
    
    <div class="col-md-3">
      <div class="mb-2">
        <label class="mb-1" for="searchCategory">Category</label>
        <select id="searchCategory" formControlName="categoryId" class="form-control">
          <option value="">All categories</option>
          @for (category of categories; track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="col-md-2">
      <div class="mb-2">
        <label class="mb-1" for="minPrice">Min Price</label>
        <input 
          id="minPrice" 
          formControlName="minPrice" 
          type="number" 
          step="0.01" 
          class="form-control"
          placeholder="0.00">
      </div>
    </div>

    <div class="col-md-2">
      <div class="mb-2">
        <label class="mb-1" for="maxPrice">Max Price</label>
        <input 
          id="maxPrice" 
          formControlName="maxPrice" 
          type="number" 
          step="0.01" 
          class="form-control"
          placeholder="0.00">
      </div>
    </div>

    <div class="col-md-2 d-flex align-items-end">
      <div class="mb-2 w-100">
        <button 
          (click)="search()" 
          class="btn btn-primary w-100" 
          type="button">
          Search
        </button>
      </div>
    </div>
  </div>

  <div class="row mt-2">
    <div class="col-12">
      <button 
        (click)="clearSearch()" 
        class="btn btn-secondary btn-sm" 
        type="button">
        Clear Filters
      </button>
    </div>
  </div>
</form>

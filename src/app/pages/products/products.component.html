<div class="container-fluid p-4">
  <div class="row mb-4">
    <div class="col-12">
      <h1 class="card-title mb-3 text-primary fw-bold fs-1">{{ isAdmin ? 'Manage Products' : 'Browse Products' }}</h1>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          @if (isAdmin) {
            <app-product-form 
              [form]="form" 
              [isEdit]="isEdit"
              [categories]="categoryService.categories$()"
              (callSaveMethod)="save($event)">
            </app-product-form>
          } @else {
            <app-product-search
              [categories]="categoryService.categories$()"
              (callSearchMethod)="searchProducts($event)">
            </app-product-search>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h3 class="card-title mb-3 text-primary fw-bold fs-1">Products List</h3>
          <app-products-table 
            [areActionsAvailable]="isAdmin"
            [products]="productService.products$()"
            (callEditMethod)="edit($event)"
            (callDeleteMethod)="delete($event)">
          </app-products-table>
          
          @if (productService.search.totalPages && productService.search.totalPages > 1) {
            <div class="mt-3">
              <app-pagination 
                [service]="productService">
              </app-pagination>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
